# Compila el APK y lo prueba en un emulador de Android. Se lanza a mano desde la pestaña
# Actions de GitHub. Las capturas de pantalla quedan como archivo descargable del resultado.
name: Probar APK en un emulador

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: |
          npm ci
          npm install --no-save playwright-core

      # La prueba no puede tocar la base real: se arma un APK en modo prueba, con config.js vacío.
      - name: Pasar a modo prueba
        run: |
          sed -i -E "s/^(  [A-Za-z]+): '[^']*',/\1: '',/" js/config.js
          grep -q "projectId: ''," js/config.js

      - name: Compilar el APK
        run: |
          npm run sincronizar
          cd android
          ./gradlew assembleDebug --console=plain

      # El emulador necesita acceso a la aceleración del procesador.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: node scripts/probar-apk.mjs

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/
          if-no-files-found: ignore
